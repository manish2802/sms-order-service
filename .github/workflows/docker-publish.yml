name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout wallet-service repository
      - name: Checkout wallet service
        uses: actions/checkout@v4

      # 2. Checkout public grpc-contract repository
      - name: Checkout grpc contract
        uses: actions/checkout@v4
        with:
          repository: manish2802/sms-grpc-contract
          path: sms-grpc-contract

      # 3. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 4. Build and install grpc-contract JAR
      - name: Install grpc contract
        working-directory: sms-grpc-contract
        run: mvn clean install -DskipTests

      # 5. Build wallet-service
      - name: Build application
        run: mvn clean package -DskipTests

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build Docker image
      - name: Build Docker image
        run: docker build -t manish28/sms-order-service:latest .

      # 8. Push Docker image
      - name: Push Docker image
        run: docker push manish28/sms-order-service:latest